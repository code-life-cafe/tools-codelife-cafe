name: Lint & Type Check
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild @biomejs/biome
      - name: Security audit
        env:
          AUDIT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SECURITY_AUDIT_DIR: ${{ runner.temp }}/security-audit
        run: |
          mkdir -p "$SECURITY_AUDIT_DIR"
          node scripts/security-audit.mjs
      - name: Save security audit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-audit-lint
          path: ${{ runner.temp }}/security-audit/
          retention-days: 14
      - name: Lint (Biome)
        run: npm run lint
      - name: Type check (astro check)
        run: npx astro check
      - name: Build check
        run: npm run build
      # links.test.ts は dist/ の内部リンク・sitemap・canonical を点検するため、
      # 必ずビルド後に実行する（dist が無いとスキップされる）
      - name: Unit tests
        run: npm run test:unit
