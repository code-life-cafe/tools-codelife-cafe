name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
  deployments: write
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  audit-baseline:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.baseline.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/security-audit-baseline.mjs
  # PRで成功済みのE2Eと同じ内容か照合する（Issue #723）。ツリーが同じで、push前のmainが
  # そのPR headの祖先である場合だけ reuse=true。照合できない・不一致は reuse=false（E2Eを実行）
  e2e-reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.check.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/e2e-reuse-check.mjs
  # デプロイ前にE2Eを実行し、失敗時はデプロイを中止する（PRで同じ内容を確認済みなら省略）
  e2e:
    needs: [audit-baseline, e2e-reuse]
    if: ${{ !cancelled() && needs.audit-baseline.result == 'success' && needs.e2e-reuse.outputs.reuse != 'true' }}
    with:
      audit-base-sha: ${{ needs.audit-baseline.outputs.sha }}
    uses: ./.github/workflows/e2e.yml
  deploy:
    needs: [audit-baseline, e2e-reuse, e2e]
    # E2E成功、または照合でE2Eを省略した場合だけデプロイする。E2Eの失敗・キャンセルでは中止する
    if: ${{ !cancelled() && needs.audit-baseline.result == 'success' && (needs.e2e.result == 'success' || (needs.e2e.result == 'skipped' && needs.e2e-reuse.result == 'success' && needs.e2e-reuse.outputs.reuse == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild
      - name: Security audit
        env:
          AUDIT_BASE_SHA: ${{ needs.audit-baseline.outputs.sha }}
          SECURITY_AUDIT_DIR: ${{ runner.temp }}/security-audit
        run: |
          mkdir -p "$SECURITY_AUDIT_DIR"
          node scripts/security-audit.mjs
      - name: Save security audit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-audit-deploy
          path: ${{ runner.temp }}/security-audit/
          retention-days: 14
      - run: npm run build
        env:
          # Cloudflare Web Analytics のサイトトークン（公開値。HTMLに出力される）。
          # GitHub の Settings > Secrets and variables > Actions > Variables に登録。
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}
      # 公開後smokeが「本番が今回のコミットを配信している」ことを確認するための公開用ファイル。
      # 内容は公開リポジトリで既知のコミットSHAと実行IDだけ（build後・公開前に生成する）。
      - name: Write build info
        run: node scripts/write-build-info.mjs dist
      - name: Get git commit hash
        run: echo "GIT_HASH=$(git rev-parse HEAD)" >> $GITHUB_ENV
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --commit-message に ASCII のみを指定（日本語等の非ASCII文字を含むメッセージを
          # Cloudflare Pages API に渡すと code:8000111 エラーになる既知の問題を回避）
          command: pages deploy dist --project-name=tools-codelife-cafe --branch=main --commit-hash=${{ env.GIT_HASH }} --commit-message="Deploy ${{ env.GIT_HASH }}"
  # 公開後の読み取りsmoke。固定の公開URLに対し、HTTP・公開SHA・既知のダミー入力でのwordcloud生成/再生成を確認する。
  # 失敗はこのジョブの失敗（=公開確認失敗）であり、deployジョブの成功と混同しない。secrets・書き込み権限は使わない。
  production-smoke:
    needs: [deploy]
    # E2Eを省略した（e2eがskipped）runでも、deployが成功したら必ず本番確認を行う。
    # if がないと、上流にskippedのジョブがあるだけでこのジョブもskippedになる
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-jammy
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild
      - name: Production smoke
        env:
          SMOKE_BASE_URL: https://tools.codelife.cafe
          EXPECTED_SHA: ${{ github.sha }}
          SMOKE_RUN_ID: ${{ github.run_id }}
          SMOKE_RUN_ATTEMPT: ${{ github.run_attempt }}
          SMOKE_OUT_DIR: ${{ runner.temp }}/production-smoke
        run: node scripts/production-smoke.mjs
      - name: Save production smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-smoke/
          retention-days: 30
