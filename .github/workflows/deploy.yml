name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
  deployments: write
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  audit-baseline:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.baseline.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - id: baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/security-audit-baseline.mjs
  # デプロイ前にE2Eを実行し、失敗時はデプロイを中止する
  e2e:
    needs: audit-baseline
    with:
      audit-base-sha: ${{ needs.audit-baseline.outputs.sha }}
    uses: ./.github/workflows/e2e.yml
  deploy:
    needs: [audit-baseline, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild
      - name: Security audit
        env:
          AUDIT_BASE_SHA: ${{ needs.audit-baseline.outputs.sha }}
          SECURITY_AUDIT_DIR: ${{ runner.temp }}/security-audit
        run: |
          mkdir -p "$SECURITY_AUDIT_DIR"
          node scripts/security-audit.mjs
      - name: Save security audit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-audit-deploy
          path: ${{ runner.temp }}/security-audit/
          retention-days: 14
      - run: npm run build
        env:
          # Cloudflare Web Analytics のサイトトークン（公開値。HTMLに出力される）。
          # GitHub の Settings > Secrets and variables > Actions > Variables に登録。
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}
      - name: Get git commit hash
        run: echo "GIT_HASH=$(git rev-parse HEAD)" >> $GITHUB_ENV
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --commit-message に ASCII のみを指定（日本語等の非ASCII文字を含むメッセージを
          # Cloudflare Pages API に渡すと code:8000111 エラーになる既知の問題を回避）
          command: pages deploy dist --project-name=tools-codelife-cafe --branch=main --commit-hash=${{ env.GIT_HASH }} --commit-message="Deploy ${{ env.GIT_HASH }}"
