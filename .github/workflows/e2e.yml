name: E2E Tests
on:
  pull_request:
    branches: [main]
  # デプロイ前ゲートとして deploy.yml からも呼び出す
  workflow_call:
    inputs:
      audit-base-sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  # 全テストを2つのジョブに分けて並列に実行する（Issue #723。テスト件数・retries・workersは変えない）
  e2e-shard:
    name: e2e (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-jammy
    env:
      # Playwright の公式コンテナに同梱されているブラウザを明示的に参照する。
      # npm ci --ignore-scripts ではブラウザを再ダウンロードしないため、環境変数が
      # 未設定だと ~/.cache/ms-playwright を探して E2E が起動前に失敗する。
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild
      # 同じ監査を2回出さないため shard 1 だけで実行する。失敗は集約ジョブ e2e の失敗になる
      - name: Security audit
        if: ${{ matrix.shard == 1 }}
        env:
          AUDIT_BASE_SHA: ${{ inputs.audit-base-sha || github.event.pull_request.base.sha }}
          SECURITY_AUDIT_DIR: ${{ runner.temp }}/security-audit
        run: |
          mkdir -p "$SECURITY_AUDIT_DIR"
          node scripts/security-audit.mjs
      - name: Save security audit reports
        if: ${{ always() && matrix.shard == 1 }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-audit-e2e
          path: ${{ runner.temp }}/security-audit/
          retention-days: 14
      - run: npm run build
      - run: npx playwright test --shard=${{ matrix.shard }}/2
      # 再試行で通った不安定テスト（flaky）の件数をジョブサマリーへ記録する（Issue #719）。
      # 記録だけの段階のため、このステップはジョブの合否を変えない（常に終了コード0）。
      - name: Record flaky E2E tests
        if: ${{ !cancelled() }}
        run: node scripts/e2e-flaky-summary.mjs test-results/e2e-results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14
  # 必須check名 e2e を維持する集約ジョブ。両shardが成功したときだけ成功する
  # （失敗・キャンセル・スキップはすべて失敗扱い）
  e2e:
    needs: e2e-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check all E2E shards
        env:
          SHARD_RESULT: ${{ needs.e2e-shard.result }}
        run: |
          echo "E2E shards: $SHARD_RESULT"
          test "$SHARD_RESULT" = "success"
