name: E2E Tests
on:
  pull_request:
    branches: [main]
  # デプロイ前ゲートとして deploy.yml からも呼び出す
  workflow_call:
    inputs:
      audit-base-sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
    env:
      # Playwright の公式コンテナに同梱されているブラウザを明示的に参照する。
      # npm ci --ignore-scripts ではブラウザを再ダウンロードしないため、環境変数が
      # 未設定だと ~/.cache/ms-playwright を探して E2E が起動前に失敗する。
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild
      - name: Security audit
        env:
          AUDIT_BASE_SHA: ${{ inputs.audit-base-sha || github.event.pull_request.base.sha }}
          SECURITY_AUDIT_DIR: ${{ runner.temp }}/security-audit
        run: |
          mkdir -p "$SECURITY_AUDIT_DIR"
          node scripts/security-audit.mjs
      - name: Save security audit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-audit-e2e
          path: ${{ runner.temp }}/security-audit/
          retention-days: 14
      - run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
