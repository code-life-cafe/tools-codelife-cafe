version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Asia/Tokyo"
    # サプライチェーン攻撃対策: 公開から7日経っていない版はPRにしない（#735）。
    # セキュリティ更新はGitHubの仕様でcooldownの対象外。
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      react:
        patterns: ["react", "react-dom", "@types/react*"]
      dev-deps:
        dependency-type: "development"
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Asia/Tokyo"
    # サプライチェーン攻撃対策: 公開から7日経っていない版はPRにしない（#735）。
    # セキュリティ更新はGitHubの仕様でcooldownの対象外。
    cooldown:
      default-days: 7
